name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: swift test --package-path macos/CodexUsageStatus
      - run: python3 lifecycle/test_lifecycle.py
      - name: Build macOS app (arm64)
        run: npm run build:macos
        env:
          BUILD_ARCH: arm64
      - name: Build macOS app (x86_64)
        run: npm run build:macos
        env:
          BUILD_ARCH: x86_64
